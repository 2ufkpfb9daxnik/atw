<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atw</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

    <div class="bg-container">
        <div class="vertical-window">
            <div class="flow-vertical-wrapper">
                <div class="flow-vertical-content" id="bgTextElementVert1"></div>
                <div class="flow-vertical-content" id="bgTextElementVert2"></div>
            </div>
        </div>
        <div class="horizontal-window">
            <div class="flow-horizontal-wrapper">
                <div class="flow-horizontal-content" id="bgTextElementHoriz1"></div>
                <div class="flow-horizontal-content" id="bgTextElementHoriz2"></div>
            </div>
        </div>
    </div>

    <main>
        <section class="card">
            <h1>atw</h1>
            <p>
                タイプウェルや<a href="https://o24.works/atc/" target="_blank" rel="noopener noreferrer">ATC Tester</a>に影響されたタイピングソフトです。個人的なgodotの習作でもあります。
            </p>

            <ul>
                <li>お題を順次入力して計測</li>
                <li>自作の順次打鍵配列・自作お題・背景を切り替え可能</li>
                <li>記録一覧、詳細リプレイ、評価表示</li>
                <li>任意の順次打鍵配列のキーガイド表示に対応</li>

                <div class="video">
                    <div class="video-frame">
                        <iframe
                            src="https://www.youtube.com/embed/2IKZLVlPjQg"
                            title="ATW demo video"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
            </ul>

            <p>
                リポジトリからダウンロード
                <a href="https://github.com/2ufkpfb9daxnik/atw" target="_blank" rel="noopener noreferrer">
                    github.com/2ufkpfb9daxnik/atw
                </a>
            </p>

            <p>
                <a href="/atw.html" target="_blank" rel="noopener noreferrer">
                    web版はこちら(記録一覧機能などが文字化けなどしていますが概ね動きます)
                </a>
            </p>
        </section>
    </main>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
